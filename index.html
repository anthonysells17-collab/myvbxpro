<style>
/* Layout: single-screen iPad presenter, five steps across a top bar, black stage with VBX red glow, big touch targets */
:root{
  --bg:#f5f4f1; --panel:#ffffff; --panel2:#f0efec; --line:rgba(23,23,26,.12);
  --fg:#17171a; --muted:#6b6b72; --red:#e3262b; --orange:#ff6a1f;
  --ink:#c41d22; --soft:#3d3d43; --hint:#85848b; --field:#ffffff; --press:#ebeae6;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:18px;line-height:1.5;margin:0;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
input,select,textarea{user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
.app::before{content:"";position:absolute;left:50%;bottom:-60%;width:150%;height:90%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 100%,rgba(227,38,43,.10),transparent 65%);pointer-events:none}
header{position:relative;z-index:2;display:flex;align-items:center;gap:24px;padding:14px 24px;border-bottom:1px solid var(--line)}
.logo{font-weight:600;letter-spacing:.18em;font-size:18px;white-space:nowrap}
.logo span{color:var(--red)}
.steps{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.sbtn{display:flex;align-items:center;gap:10px;background:none;border:none;padding:10px 14px;border-radius:999px;color:var(--muted);white-space:nowrap;font-size:15px}
.sbtn i{font-style:normal;font-size:13px;font-weight:600;color:var(--red)}
.sbtn[aria-current="step"]{background:rgba(227,38,43,.1);color:var(--ink)}
.reset{background:none;border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;color:var(--muted);white-space:nowrap}
main{position:relative;z-index:1;flex:1;min-height:0;overflow:auto;padding:28px 28px 120px}
.screen{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--ink)}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:500;letter-spacing:-.01em;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(42px,5.4vw,68px)}
h1 em,h2 em{font-style:italic;color:var(--red)}
h2{font-size:clamp(34px,4vw,48px)}
h3{font-size:26px;font-weight:600}
p{margin:0}
.lead{font-size:20px;font-weight:300;color:var(--muted);max-width:60ch}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:120px;transition:border-color .15s,background .15s}
.tile:active{transform:scale(.98)}
.tile b{font-size:20px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.tile span{font-size:14px;color:var(--muted)}
.tile.on{border-color:var(--red);background:rgba(227,38,43,.12)}
.stat{background:var(--panel);border-radius:16px;border-top:4px solid var(--red);padding:22px;display:flex;flex-direction:column;gap:6px}
.stat .v{font-family:var(--serif);font-size:54px;line-height:.9;color:var(--red);font-variant-numeric:lining-nums}
.stat .l{font-size:17px;font-weight:600;letter-spacing:-.01em}
.stat .d{font-size:14px;color:var(--muted)}
.stat .src{font-size:12px;color:var(--hint);margin-top:auto;padding-top:6px}
.stat.hl{background:linear-gradient(160deg,rgba(227,38,43,.16),var(--panel) 60%)}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;position:relative}
.flow .fs{background:var(--panel);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px;position:relative}
.fs .n{width:44px;height:44px;border-radius:50%;border:1px solid var(--red);display:grid;place-items:center;font-size:16px;font-weight:600}
.fs:last-child .n{background:var(--red)}
.fs .st{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);margin-top:4px}
.fs b{font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
.fs span{font-size:14.5px;color:var(--muted)}
@media (max-width:900px){.flow{grid-template-columns:1fr 1fr}}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.meta div{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.meta .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.meta .v{font-size:16px;font-weight:500}
/* calculator */
.calc{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:start}
@media (max-width:900px){.calc{grid-template-columns:1fr}}
.inputs{display:flex;flex-direction:column;gap:14px}
.row{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:center;background:var(--panel);border-radius:14px;padding:12px 14px 12px 18px}
.row label{font-size:16px}
.row small{display:block;font-size:12.5px;color:var(--muted)}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--field)}
.stepper button{width:60px;height:56px;border:none;background:var(--panel2);font-size:28px;line-height:1}
.stepper button:active{background:var(--press)}
.stepper .in{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;font-size:24px;font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.stepper input{width:100%;max-width:110px;background:none;border:none;color:var(--fg);text-align:center;font:inherit;-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--field);font-size:15px}
.seg button.on{border-color:var(--red);background:rgba(227,38,43,.16)}
.out{background:var(--panel);border-radius:18px;border-top:4px solid var(--red);padding:26px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0}
.out .k{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.out .pay{font-family:var(--serif);font-size:clamp(46px,5.4vw,66px);line-height:.95}
.out .mon{font-family:var(--serif);font-size:clamp(44px,5vw,60px);line-height:.95;color:var(--red);font-variant-numeric:lining-nums}
.lines{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ln{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--muted)}
.ln b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--hint)}
/* lead */
.leadwrap{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:start}
@media (max-width:900px){.leadwrap{grid-template-columns:1fr}}
form{background:var(--panel);border-radius:18px;border-top:4px solid var(--red);padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
form .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{font:inherit;font-size:18px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:13px 14px;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--red)}
.big-btn{grid-column:1/-1;height:62px;border:none;border-radius:12px;background:var(--red);color:#fff;font-size:16px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;box-shadow:0 10px 40px rgba(227,38,43,.35)}
.big-btn:active{transform:scale(.99)}
.err{grid-column:1/-1;color:var(--ink);font-size:15px}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:6px}
.card .v{font-size:21px;font-weight:600;letter-spacing:-.01em}
.card .k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
.done{display:flex;flex-direction:column;gap:14px;align-items:flex-start;background:var(--panel);border-radius:18px;border-top:4px solid var(--red);padding:30px}
.done pre{white-space:pre-wrap;font-family:var(--sans);font-size:14px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0;user-select:all;width:100%}
.ghost{height:52px;padding:0 22px;border-radius:12px;border:1px solid var(--line);background:none;font-size:15px}
.recent{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}
.recent div{font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px}
.recent b{color:var(--fg);font-weight:500}
/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-between;gap:12px;padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 60%,transparent)}
.nav button{height:58px;padding:0 30px;border-radius:12px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.nav .back{background:none;border:1px solid var(--line);color:var(--muted)}
.nav .next{background:var(--red);border:none;color:#fff;box-shadow:0 10px 40px rgba(227,38,43,.35)}
.nav button:disabled{opacity:.35}
button.stat{border:none;text-align:left;color:inherit;cursor:pointer}
.stat .more{display:none;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.stat.open .more{display:flex}
.stat.open{grid-column:span 1;box-shadow:0 0 0 1px var(--red)}
.stat .more p{font-size:14.5px;color:var(--soft)}
.stat .kind{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.meter{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.bars{display:flex;gap:4px}.bars i{width:22px;height:4px;background:var(--press);display:block}.bars i.on{background:var(--red)}
.mech{background:var(--panel);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.mflow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mflow div{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--soft)}
.mflow b{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--red);display:grid;place-items:center;font-size:14px;font-weight:600}
@media (max-width:900px){.mflow{grid-template-columns:1fr 1fr}}
.tier{background:var(--panel);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:6px}
.tier b{font-size:18px;font-weight:600;letter-spacing:-.01em}
.tier .t{font-size:22px;font-weight:600;color:var(--red);line-height:1.1;letter-spacing:-.01em}
.tier span{font-size:15px;color:var(--soft)}
.tier .sn{font-size:12px!important;color:var(--muted)!important;letter-spacing:.04em;margin-top:auto}
.tier.hlt{border:1px solid var(--red);background:rgba(227,38,43,.1)}
.dtabs{max-width:760px}
.how{border-top:1px solid var(--line);padding-top:12px}
.how summary{cursor:pointer;font-size:14px;color:var(--ink)}
.how ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.tbl{display:flex;flex-direction:column;background:var(--panel);border-radius:16px;overflow:hidden}
.tr{display:grid;grid-template-columns:1.2fr 1fr 1.2fr 1fr;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px}
.tr.th{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.tr.us{background:rgba(227,38,43,.12)}.tr.us span:first-child{color:var(--ink);font-size:16px;font-weight:600}
.tr span:first-child{font-size:15px;font-weight:600}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
.stat,.out,.card,.tier,.mech,.row,.tbl{box-shadow:0 0 0 1px var(--line),0 2px 10px rgba(23,23,26,.04)}
header{background:rgba(255,255,255,.85)}
.stat.hl{background:linear-gradient(160deg,rgba(227,38,43,.08),var(--panel) 60%)}
</style>

      var r=compute();
      var l={name:$('l-name').value.trim(),clinic:$('l-clinic').value.trim(),type:t.name,phone:$('l-phone').value.trim(),email:$('l-email').value.trim(),time:$('l-time').value,interest:$('l-temp').value,notes:$('l-notes').value.trim(),
        calc:{members:S.c.members,dues:S.c.dues,plates:S.c.plates,profit:Math.round(r.mon),payback:r.when},source:'booth',createdAt:Date.now()};
      if(!l.name||(!l.phone&&!l.email)){$('l-err').hidden=false;return}
      var msg='VBX Pro lead\n'+l.name+(l.clinic?' · '+l.clinic:'')+' · '+l.type+(l.phone?'\n'+l.phone:'')+(l.email?'\n'+l.email:'')+'\nBest time: '+l.time+' · '+l.interest+(l.notes?'\nNotes: '+l.notes:'')+'\nEstimate: +'+money(l.calc.profit)+'/mo, pays back in '+l.calc.payback;
      function saved(ok){
        $('formbox').innerHTML='<div class="done"><h3>'+(ok?'Saved. '+esc(l.name)+' is on your list.':'Not saved here. Text or email this to yourself.')+'</h3>'+(ok?'':'<pre>'+esc(msg)+'</pre>')+'<button type="button" class="big-btn" id="nv" style="width:100%">Next visitor</button></div>';
        $('nv').onclick=newVisitor;
      }
      if(db&&canSave){db.collection('leads').add(l).then(function(){saved(true)},function(){saved(false)})} else saved(false);
    };
  }
  var recentDocs=[];
  function renderRecent(){
    var box=$('recentbox'); if(!box)return;
    if(!canSave){box.hidden=true;return}
    box.hidden=false;
    var today=new Date().toDateString();
    var list=recentDocs.filter(function(d){return new Date(d.createdAt).toDateString()===today});
    $('recent').innerHTML=list.length?list.map(function(d){return '<div><b>'+esc(d.name)+'</b> · '+esc(d.clinic||d.type)+'<br>'+esc(d.phone||d.email)+' · '+esc(d.interest||'')+'</div>'}).join(''):'<div>No leads yet today.</div>';
  }
  function newVisitor(){S.type=null;S.c=null;go(0)}

  $('back').onclick=function(){go(S.step-1)};
  $('next').onclick=function(){if(S.step===5)newVisitor();else go(S.step+1)};
  $('reset').onclick=newVisitor;
  go(0);

  if(window.claude&&window.claude.use){
    Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
      db=r[0];var u=r[1]; if(!db||!u)return;
      return Promise.all([u.isOwner(),u.canEdit()]).then(function(f){
        canSave=f[0]||f[1]; if(!canSave)return;
        db.collection('leads').orderBy('createdAt','desc').limit(100).onSnapshot(function(snap){recentDocs=snap.docs.map(function(d){return d.data()||{}});renderRecent()});
      });
    }).catch(function(){});
  }
})();
</script>
